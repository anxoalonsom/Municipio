<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Incidencias</title>
</head>
<body>
    <h1>Formulario de Incidencias - IES Teis</h1>
    
   <form action="/incidencias" method="POST">
    <label for="dni">DNI:</label><br>
    <input type="text" id="dni" name="dni" required><br><br>

    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="direccion">Dirección:</label><br>
    <input type="text" id="direccion" name="direccion" required><br><br>

    <label for="puesto">Puesto:</label><br>
    <input type="text" id="puesto" name="puesto" required><br><br>

    <button type="submit">Guardar Incidencia</button>
</form>
</body>
</html>
